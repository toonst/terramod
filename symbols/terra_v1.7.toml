[free_resources]
# Flash after the image: 0x08059A54..0x0805FFFF is the rest of sector 3. Sectors 4+ unknown.
# TODO RAM map: DTCM 0x20000000 (128K), AXI SRAM 0x24000000, SRAM1-3 0x30000000, SDRAM at 0xC0000000?
# TODO audio callback headroom.

# Resources already taken by mods in this repo. A new mod must not reuse them (the patcher only detects shared hook sites).
[[allocation]]
what = "flash 0x08059A54.. (appended trampolines)"
by = "all mods; the patcher places them one after the other"
[[allocation]]
what = "RAM 0x2001FFF0..0x2001FFF7 (top of DTCM: magic + last saved settings byte; nothing in the image references it)"
by = "persist-settings"
[[allocation]]
what = "EEPROM 0x1A..0x1B (unused by the stock firmware, see docs/eeprom-map.md)"
by = "persist-settings"
