# Symbol map for TERRA_V1.7.smf
# sha256 of the .smf: 70db296e2db1f553f8378db35eb14aebccc3810a83065b058f47a6f45a8a3572
# Addresses are runtime addresses. Status: confirmed | inferred | guess.

[image]
load_base   = 0x08020000   # confirmed
image_end   = 0x08059A54   # exclusive; payload_len = 236116
initial_sp  = 0x2001CD58
toolchain   = "Keil/armcc-style startup (scatterload + __rt_entry)"   # inferred
# CORRECTION to the earlier draft (F4): SystemInit touches RCC at 0x58024400, FLASH at 0x52002000
# and FMC at 0x52004000. Those are STM32H7 addresses, and main() sets up 9 MPU regions and the
# D/I caches. So the MCU is an STM32H7 (Cortex-M7).
mcu_family  = "STM32H7 (Cortex-M7)"       # confirmed by peripheral addresses; exact part unknown
bootloader  = "0x08000000..0x0801FFFF (one 128 KB H7 flash sector), not in this image"  # inferred
vtor        = 0x08020000   # confirmed: main() writes it to SCB->VTOR; SystemInit first writes 0x08000000
flash_sector = "128 KB on H7: this image spans sectors 1..3 (0x08020000..0x0805FFFF)"

[[function]]
name = "Reset_Handler"
address = 0x08051CC4
status = "confirmed"
notes = "ldr r0,=SystemInit; blx; ldr r0,=__main; bx"

[[function]]
name = "SystemInit"
address = 0x08051974
status = "confirmed"
notes = "ST-style: enable FPU, FLASH latency, RCC reset values, FMC->BTCR[0]=0x30D2, VTOR=0x08000000"

[[function]]
name = "__main"
address = 0x08051CA8
status = "confirmed"
notes = "sets PSP, calls 0x08051BB4 (enables FPU in CPACR) then __rt_entry at 0x08051C60"

[[function]]
name = "__rt_entry"
address = 0x08051C60
status = "confirmed"
notes = "scatterload (0x08051B8C) if needed, then calls main (0x0803E878)"

[[function]]
name = "scatterload"
address = 0x08051B8C
status = "confirmed"

[[function]]
name = "main"
address = 0x0803E878
status = "confirmed"
notes = """VTOR=0x08020000; MPU with 9 regions (0x00000000, 0x20000000, 0x24000000 AXI SRAM,
0x30000000 SRAM1-3, 0x40000000, 0x60000000, 0x80000000, 0xA0000000, 0xC0000000 FMC); enable I/D cache;
then init sequence ending in FUN_080358a8 (very large, 81k chars of decompiler output) and an
empty infinite loop. All real work is therefore interrupt driven or inside FUN_080358a8."""

[[function]]
name = "hw_config_and_leds_init"
address = 0x0803ABA6
status = "inferred"
notes = """Reads the 0x40-byte config block at EEPROM 0 (eeprom_read; "SOMA" magic at +0x1C), substitutes defaults
(16 x u16 = 400, 24 x u8 = 0x32) and rewrites bytes 0..0x3F if the magic is missing, flashes the LEDs when defaults
had to be used, then brings up peripherals. Its EEPROM accesses are emulated in tools/terra_fw/tests/test_eeprom_boot.py;
the EEPROM layout is in docs/eeprom-map.md."""

[[function]]
name = "delay_ms"
address = 0x0803A7E8
status = "inferred"

[[function]]
name = "midi_uart_init"
address = 0x08041830
status = "confirmed"
notes = "HAL-style UART init with baud 0x7A12 = 31250 (MIDI). USART1 is referenced in this function's literal pool."

[[function]]
name = "Error_Handler"
address = 0x0803EC24
status = "inferred"
notes = "called on every failed HAL init"

[[function]]
name = "spi2_init_slow"
address = 0x08044FAC
status = "inferred"
notes = "HAL SPI init, master, prescaler field 0x70000000 (the /256 setting on H7); peripheral base is SPI2/I2S2 (0x40003800). Purpose unknown."

[[function]]
name = "I2C1_EV_IRQHandler"
address = 0x08051622
status = "inferred"
notes = "hand-rolled I2C event ISR (reads ISR/CR1 flag bits); shares code with the I2C2 handler at 0x080516F2"

[[function]]
name = "app_main_loop"
address = 0x080358A8
status = "confirmed"
notes = """Never returns. ~2200 lines of decompiled output. Superloop: polls touch_scan (FUN_0803AAFE) until it returns != 1.
MIDI part of each pass (confirmed, disassembly 0x08035AB2..0x08035ADA): if the SysEx state (0x20019BB4) is 4 or 5, call
sysex_tx_pump; otherwise, if ctx+0x618 != 0, call midi_out_pump; then, if the SysEx state is 3, call sysex_dispatch (0x0803C25C).
Reloads the preset block (FUN_08031EF4) when the sensor bits change. Uses the FPU heavily. Most likely the
UI/sensor/preset state machine. Audio rendering is not here: it runs in the TIM3 interrupt in ITCM (see [itcm])."""

[[label]]
name = "main_loop_pass_head"
address = 0x08035A56
status = "confirmed"
notes = """Head of every app_main_loop pass: `ldr.w r0,[pc,..]` (= 0x2001BC0C, the USART1 handle). Hook site of the
persist-settings mod (verified by emulating the patched image: test_persist_settings.py)."""

[[label]]
name = "pitchdown_mode_selector"
address = 0x08036E9E
status = "confirmed"
notes = """Block in app_main_loop (0x08036E9E..0x08036ED4) that sets the "A + tuning" pitch-down mode: stores the index to
pitchdown_mode and the matching float to pitchdown_amount (0x3DDF7058, 0.5, or s28 = 1.0). Verified by disassembly.
The address 0x2000337C occurs once as a literal (0x0803797C) and only this block's three loads use it, so this is the
only code that touches pitchdown_mode (barring computed addresses)."""

[[label]]
name = "midi_settings_save"
address = 0x080363C8
status = "confirmed"
notes = """In app_main_loop: byte ctx+0x1E8 & 0x33 (channel bits only, the mode bits 2-3 are dropped) -> ctx+0x1EA and
eeprom_write(0x38, .., 1). This is why the MIDI mode is lost at power-off. Verified by disassembly."""

[[label]]
name = "midi_mode_change_check"
address = 0x080363F0
status = "confirmed"
notes = """In app_main_loop: if u16 ctx+0x1E8 != ctx+0x1EC, send midi_enqueue_all_off on channel ctx+0x1EE, clear ctx+0x668..0x670
and copy ctx+0x1E8 to ctx+0x1EC; then if (ctx+0x1E8 & 0xC) != 0 set ctx+0x618 = 1. Verified by disassembly
(0x080363F0..0x0803641E). Not yet checked: whether this block runs on every pass or only inside the settings UI
(persist-settings sets ctx+0x618 itself, so it works either way)."""

[[function]]
name = "preset_save"
address = 0x08038808
status = "inferred"
notes = "writes EEPROM[0] (last used preset) when a preset is saved (docs/eeprom-map.md, static)"

[[function]]
name = "preset_apply_live"
address = 0x08038AB4
status = "inferred"
notes = "used by SysEx writes with preset 0x7F to apply a record to the live preset instead of EEPROM (docs/midi-sysex.md)"

[[function]]
name = "sensor_calibration"
address = 0x080330B4
status = "inferred"
notes = "writes EEPROM 0x02..0x19 (at 0x080338E2) and 0x20..0x3F (at 0x080338D0) (docs/eeprom-map.md, static)"

[[function]]
name = "touch_scan"
address = 0x0803AAFE
status = "inferred"
notes = """Sensor scan. Drops the two touch buses' interrupts, pulses a GPIOB pin (reset?), starts DMA reads on
I2C1 (handle 0x2001BFD8) and I2C2 (handle 0x2001C02C), then reads 12 bytes from each via FUN_0803E780 with
I2C address 0xB4 (= 7-bit 0x5A, MPR121 default). Results land at 0x2001C0D6 and 0x2001C0E2. Returns 0 on
success (counter at +0x40 incremented), 1 on failure (+0x44). Looks like 2 x 12 = 24 touch channels.
The chip identity (MPR121-class) is a guess from the address."""

[[function]]
name = "eeprom_read"
address = 0x0803AE58
status = "confirmed"
notes = """i2c_mem_read(handle 0x2001C080, dev 0xA0, mem_addr, 2-byte addressing, buf, len, timeout=-1).
Device address 0xA0 = 7-bit 0x50: an external I2C EEPROM (24Cxx class) with 16-bit addresses.
This is where user presets and calibration live, NOT internal flash. Args seen: addr 0x00 (0x40-byte
config block, "SOMA" magic 0x414D4F53 at +0x1C), 0x20, 0x38, 0x01."""

[[function]]
name = "eeprom_write"
address = 0x0803AE78
status = "confirmed"
notes = "drops GPIOD pin 11 (0x800) = write-protect, i2c_mem_write, polls i2c_is_device_ready until the write cycle ends, raises WP again"

[[function]]
name = "i2c_mem_read"
address = 0x080403F8
status = "confirmed"
[[function]]
name = "i2c_mem_write"
address = 0x0804020A
status = "confirmed"
[[function]]
name = "i2c_is_device_ready"
address = 0x0804072C
status = "confirmed"

[[irq_notes]]
vector30 = "DMA1_Stream3 -> USART DMA (handle 0x2001BE20, used next to the MIDI UART code), jumps to HAL callback 0x0803C478"
vector72_73 = "DMA2_Stream0/1 -> RX-complete for I2C1/I2C2 touch reads (handles 0x2001B98C / 0x2001BA08): sets timeout counters at 0x2001C3F0/F4 to 100, stops DMA, re-enables I2C interrupts"
vector45 = """vec 45 handler at 0x0805161E is a veneer `ldr pc,[pc]` to 0x00009731, i.e. code in ITCM (0x00000000 region),
copied there by the scatter loader. tools/scatter_emu.py runs the scatter loader and recovers that image (see [itcm]);
it holds the TIM3 audio interrupt."""

[itcm]
# Reproduce with: uv run python tools/scatter_emu.py build/app.bin build/ram   (Unicorn, runs scatterload at 0x08051B8C)
# ITCM image (44,888 bytes at 0x00000000) is copied from flash by the scatter loader. It holds the
# engine code: float/VFP heavy, touches only TIM3 SR/ARR, GPIOA IDR, GPIOD BSRR directly.
tim3_isr = 0x00009730   # confirmed: vec 45 -> veneer 0x0805161E -> ITCM 0x9730
tim3_isr_notes = """clears TIM3_SR, rewrites TIM3_ARR from *0x20003384 (variable tick period), pulses GPIOD pin 14
(probably a CPU-load/debug pin), decrements software timers, and writes two int32 values converted from
floats (DTCM 0x20000A04/A08 * scale) to 0x30000074/0x30000078. That 2-word buffer is handed to a
DMA/peripheral start routine from main(): FUN_08045436(handle 0x2001BF80, buf 0x30000074, 2)."""

[[function]]
name = "i2s1_init"
address = 0x08044E64
status = "confirmed"
notes = """HAL_I2S_Init on SPI1/I2S1 (0x40013000), handle 0x2001BF80: master TX (mode field 4), Philips standard,
MCLK output enabled (0x02000000), AudioFreq = 0xAC44 = 44100 Hz, MasterKeepIOState set (0x4000)."""

[[function]]
name = "hal_i2s_init"
address = 0x080452F4
status = "inferred"

[[function]]
name = "i2s_transmit_dma_start"
address = 0x08045436
status = "confirmed"
notes = """HAL_I2S_Transmit_DMA-style: DMA(src=pData, dst=I2S_TXDR = base+0x20, size words); sets CFG1.TXDMAEN (bit 15),
SPE (CR1 bit 0) and CSTART (CR1 bit 9). main() calls it with buffer 0x30000074, size 2 words = one stereo frame."""

[audio_path]
summary = """AUDIO = I2S1 master TX at 44.1 kHz (MCLK out) to an external DAC/codec. A TIM3 interrupt in ITCM (0x9730)
computes the next stereo frame as floats, converts to int32 and stores it at 0x30000074/0x30000078; DMA feeds
that 2-word buffer to SPI1_TXDR. TIM3 ARR is rewritten each tick (variable period)."""


# ---------------------------------------------------------------------------------------------
# MIDI (USART1, 31250 baud, PA9 TX / PA10 RX)
[midi]
summary = """RX: USART1 RX via circular DMA (DMA1 stream 3, DMAMUX request 41); no USART interrupt is used.
TX: NO DMA, NO IRQ. The main loop polls USART1_ISR.TXE (0x4001101C bit 7) and writes USART1_TDR (0x40011028)
directly, one byte per loop pass, from two sources: the note/CC ring queue and the SysEx reply buffer."""
usart1_isr = 0x4001101C
usart1_tdr = 0x40011028

[midi.queue]
ctx_base = 0x20003394        # "synth/MIDI state" struct, pointed to by literal DAT_0803A478
entries = "u16 x 256 at ctx+0x3E0 (one MIDI byte per entry), write idx ctx+0x5E0, read idx ctx+0x5E4 (both & 0xFF)"
pending_count = "u16 at ctx+0x1F0; generators stop when >= 0xB4 (180) to leave headroom"
mode = "ctx+0x1E8 & 0xC: 0, 4 (single-channel), 8, 0xC (MPE-style per-voice channels); channel at ctx+0x1EE"
running_status = "enqueue helpers only emit a status byte when the channel/type changed or after 0xE/0x18 messages (counters at ctx+0x664..0x680)"

[[function]]
name = "midi_out_pump"
address = 0x08039940
status = "confirmed"
notes = """Called from app_main_loop (0x08035ACC) when ctx+0x618 ("MIDI output active") != 0 and the SysEx state is not 4/5
(confirmed by disassembly; an earlier note here said ctx+0x30C, which is wrong). If TXE: pops one u16 from the
queue to USART1_TDR. Then generates new events: per-voice Note On/Off with velocity from float pressure state
(clamped to 0x7F), pitch bend, poly pressure/channel pressure, CCs 0x10-0x13, 0x14+(0..11), 0x66-0x6B."""

[[function]]
name = "sysex_tx_pump"
address = 0x080398BE
status = "confirmed"
notes = "If TXE: sends 0xF0, then the reply buffer ctx2+0x14.., then 0xF7 and resets the SysEx state to 0. ctx2 = 0x20019BB4"

[[function]]
name = "midi_enqueue_note"
address = 0x0803A1A8
status = "confirmed"
notes = "(note, velocity, channel) -> 0x90+ch, note, vel; velocity 0 = note off"
[[function]]
name = "midi_enqueue_cc"
address = 0x0803A21C
status = "confirmed"
notes = "(cc, value, channel) -> 0xB0+ch"
[[function]]
name = "midi_enqueue_poly_pressure"
address = 0x0803A298
status = "confirmed"
notes = "(note, pressure, channel) -> 0xA0+ch"
[[function]]
name = "midi_enqueue_all_off"
address = 0x0803A30C
status = "confirmed"
notes = "(channel) -> CC 0x78 (all sound off), 0x79 (reset controllers), 0x7B (all notes off), value 0"
[[function]]
name = "midi_enqueue_pitchbend"
address = 0x0803A3A8
status = "confirmed"
notes = "(value14, channel) -> 0xE0+ch, LSB, MSB (value saturated to 14 bits)"
[[function]]
name = "midi_enqueue_channel_pressure"
address = 0x0803A42C
status = "confirmed"
notes = "(value, channel) -> 0xD0+ch"

[sysex]
state_ctx = 0x20019BB4
state_values = "0 idle, 3 command received, 4 reply ready, 5 error reply (state at ctx[0]; bytes from ctx+0x14)"
framing = "header bytes at ctx+0x15..0x17 must be 'T','E','R'; command byte at ctx[6] equals ctx+0x1B; value at ctx[5] must be 0x7E"
data_encoding = "each 32-bit word is sent as 5 seven-bit bytes (>>28, >>21&7F, >>14&7F, >>7&7F, &7F)"
handler = "sysex_dispatch @0x0803C25C: commands 0..11 (0/2 dump all, 1, 3, 4, 5, 6/8/10 sub-dumps, 7/9/11 write preset)"
preset_write = "7/9/11 write to EEPROM at 0x40 + (bank*16 + slot)*0x20 (+0x18 for the 8 param bytes); slot 0x7F = factory reset of that record"

[midi_in]
byte_buffer = 0x30000000        # 1-byte circular DMA buffer (HAL_UART_Receive_DMA(huart1, buf, 1))
handler = 0x0803C478            # DMA1_Stream3 TC callback = per-byte MIDI input handler (not a Ghidra function yet)
sysex_ctx = 0x20019BB4
omnichord_enable = 0x2000366C
omnichord_count = 0x2001C3FC
omnichord_notes = 0x200035F8    # u16[12], note-12
omnichord_notes2 = 0x20003610   # u16[12]
terra_midi_channel = 0x20003582 # u16
tune_from_keyboard_enable = 0x2001C3B8
tune_from_keyboard_note = 0x20003378
running_status_ctx = 0x2001C398
notes = "full write-up in docs/midi-sysex.md"

[eeprom_layout]
presets = "records of 0x20 bytes at EEPROM 0x40 + (bank*16 + slot)*0x20; 6 banks x 16 sensors (A-D, 1-12)"
dump_range = "EEPROM 0x40..0xFFF (4032 bytes) = exactly the .smp payload (4048-byte file with the 16-byte header)"
tail = "EEPROM 0xC40..0xFFF (960 bytes) = the .smp 'tail' tables (pitch-shifter etc.)"

[peripherals_seen]
# Peripheral base addresses found in literal pools (count of references). Not proof of use by itself.
used_for_sure = ["USART1 (MIDI, 31250 baud)", "I2C1", "I2C2", "SPI2 (init at 0x08044FAC)", "FMC (BCR1=0x30D2)", "RCC", "FLASH"]
also_referenced = ["ADC1/2", "ADC3", "GPIOA..H", "SPI1/I2S1", "SPI3/I2S3", "TIM1/3/4/5/15", "USART2/3/6", "UART4/5", "DMA1/DMA2/DMAMUX1"]
not_referenced = ["SAI1", "SAI2", "SAI4", "USB OTG (no literal found)"]
# No SAI references: the audio output is probably I2S on SPI1/2/3, possibly driven by DMA from an ISR.
# The USB-stick update is the BOOTLOADER's job; this app has no USB host code visible by base address.

[open_questions]
audio = "MOSTLY ANSWERED: see [audio_path]. Still open: how DMA runs (circular?), whether TIM3 is the sample clock, and the engine call tree inside ITCM"
presets = "ANSWERED: external I2C EEPROM at 0xA0; layout in [eeprom_layout] and docs/eeprom-map.md; the .smp payload is EEPROM 0x40..0xFFF"
sensors = "ANSWERED (mostly): FUN_0803AAFE reads 2 x 12 touch channels over I2C1/I2C2 via DMA"
preset_params = "OPEN: meaning of the 8 packed parameter bytes per preset and of bit 7 of the note bytes"

