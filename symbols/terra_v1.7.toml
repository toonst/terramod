# RAM variables. ctx = 0x20003394 (the synth/MIDI state struct, see [midi.queue]).
[[data]]
name = "pitchdown_mode"
address = 0x2000337C
type = "u32"
status = "confirmed"
notes = "A + tuning pitch-down mode: 0 = 2 semitones, 1 = 12 semitones, 2 = until full stop (default). Only pitchdown_mode_selector references it."

[[data]]
name = "pitchdown_amount"
address = 0x20003380
type = "float"
status = "confirmed"
notes = "1 - 2^(-n/12) for the mode: 0x3DDF7058 (2 st), 0.5 (12 st), 1.0 (stop). Read by the engine at 0x08025DF4/0x08025E0C (disassembly)."

[[data]]
name = "midi_settings"
address = 0x2000357C   # ctx+0x1E8
type = "u16"
status = "confirmed"
notes = """MIDI output settings: mode in bits 2-3 (0 off, 4, 8, 0xC = MPE; see [midi.queue]), channel selection in bits 0, 1, 4, 5.
Only `& 0x33` is saved (midi_settings_save). Restoring the mode bits at boot is what persist-settings does (emulated in its tests)."""

[[data]]
name = "midi_settings_prev"
address = 0x20003580   # ctx+0x1EC
