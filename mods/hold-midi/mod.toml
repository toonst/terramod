# Note Keyboard Hold also holds the MIDI notes (see docs/bugs/hold-midi-notes.md)
[mod]
id = "hold-midi"
version = "0.1.0"
fw_version = "1.7"
targets = ["70db296e2db1f553f8378db35eb14aebccc3810a83065b058f47a6f45a8a3572"]   # TERRA_V1.7.smf

# Note mode: voice key-down flag pointer is r5; hold flag is +0x60 bytes away.
# Replaces: ldrh r0,[r5] ; ldr.w r2,[pc,..] ; cmp r0,#0     (returns to the beq.w at 0x080399E2)
[[hook]]
at = 0x080399DA
expect = "2888dff8"
asm = """
ldrh r0, [r5]
ldrh.w ip, [r5, #0x60]
orrs.w r0, r0, ip
movw r2, #0x3394
movt r2, #0x2000
b.w #0x080399E2
"""

# MPE mode: flag pointer is saved at [sp,#0x10].
# Replaces: ldr r1,[sp,#0x10] ; ldrh r0,[r1] ; cmp r0,#0   (returns to the beq.w at 0x08039ED6)
[[hook]]
at = 0x08039ED0
expect = "04990888"
asm = """
ldr r1, [sp, #0x10]
ldrh r0, [r1]
ldrh.w ip, [r1, #0x60]
orrs.w r0, r0, ip
b.w #0x08039ED6
"""
