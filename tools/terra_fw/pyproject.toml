[project]
name = "terra_fw"
version = "0.1.0"
description = "Tools for SOMA Terra firmware (.smf) and preset (.smp) files"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "keystone-engine", "capstone"]
patch = ["keystone-engine"]

[project.scripts]
terra-fw = "terra_fw.cli:main"

[tool.setuptools]
packages = ["terra_fw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
