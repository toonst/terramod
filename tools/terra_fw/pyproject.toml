[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terra_fw"
version = "0.1.0"
description = "Tools for SOMA Terra firmware (.smf) and preset (.smp) files"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
dependencies = ["keystone-engine"]

[project.scripts]
terra-fw = "terra_fw.cli:main"

[tool.setuptools]
packages = ["terra_fw"]
